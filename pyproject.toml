[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multiproposal"
version = "0.1.0"
description = "Research code for multiproposal MCMC"
authors = [{ name = "Guillermina Senn" }]
dependencies = [
	"arviz>=0.20,<1",
]

[project.scripts]
mcmc-platform = "multiproposal.platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]